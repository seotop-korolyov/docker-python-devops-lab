name: Docker CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build Image
        run: |
          docker build -t docker-python-devops-lab:dev .

      - name: ci-api
        run: |
          docker run -d --name ci-api -p 8000:8000 docker-python-devops-lab:dev

          curl -fsS --retry 5 --retry-delay 2 \
          --retry-connrefused --retry-all-errors \
          http://127.0.0.1:8000/health | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          if data["status"] == "ok":
            print("Health check PASSED")
            sys.exit(0)
          print("Health check FAILED")
          sys.exit(1)'

      - name: Inspect container
        if: failure()
        run: |
          docker ps -a --filter "name=ci-api"
          docker logs ci-api
          docker inspect --format='{{.State.Status}} \
          | RestartCount={{.RestartCount}} \
          | ExitCode={{.State.ExitCode}}' ci-api

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        run: |
          docker tag docker-python-devops-lab:dev ghcr.io/seotop-korolyov/docker-python-devops-lab:latest
          docker push ghcr.io/seotop-korolyov/docker-python-devops-lab:latest

          docker tag docker-python-devops-lab:dev ghcr.io/seotop-korolyov/docker-python-devops-lab:${{ github.sha }}
          docker push ghcr.io/seotop-korolyov/docker-python-devops-lab:${{ github.sha }}

  validate-k8s:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install kubeconform
        run: |
          VERSION="v0.7.0"

          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o kubeconform.tar.gz

          tar -xzf kubeconform.tar.gz kubeconform

          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

          kubeconform -v

      - name: Validate all YAML
        run: |
          kubeconform -strict -summary -kubernetes-version 1.36.0 k8s/*.yaml